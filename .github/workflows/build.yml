name: Build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build EXE
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force
          Import-Module ps2exe
          Invoke-ps2exe -inputFile TraceCheck.ps1 -outputFile TraceCheck.exe -noConsole -requireAdmin -STA -title "Alt Checker" -iconFile AltChecker.ico
      - uses: actions/upload-artifact@v6
        with:
          name: TraceCheck
          path: TraceCheck.exe
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Mac app
        run: |
          mkdir -p AltChecker.iconset AltChecker.app/Contents/MacOS AltChecker.app/Contents/Resources
          cp MacInfo.plist AltChecker.app/Contents/Info.plist
          sips -z 16 16 AltChecker.png --out AltChecker.iconset/icon_16x16.png
          sips -z 32 32 AltChecker.png --out AltChecker.iconset/icon_16x16@2x.png
          sips -z 32 32 AltChecker.png --out AltChecker.iconset/icon_32x32.png
          sips -z 64 64 AltChecker.png --out AltChecker.iconset/icon_32x32@2x.png
          sips -z 128 128 AltChecker.png --out AltChecker.iconset/icon_128x128.png
          sips -z 256 256 AltChecker.png --out AltChecker.iconset/icon_128x128@2x.png
          sips -z 256 256 AltChecker.png --out AltChecker.iconset/icon_256x256.png
          sips -z 512 512 AltChecker.png --out AltChecker.iconset/icon_256x256@2x.png
          sips -z 512 512 AltChecker.png --out AltChecker.iconset/icon_512x512.png
          sips -z 1024 1024 AltChecker.png --out AltChecker.iconset/icon_512x512@2x.png
          iconutil -c icns AltChecker.iconset -o AltChecker.app/Contents/Resources/AltChecker.icns
          xcrun swiftc -O -parse-as-library -sdk "$(xcrun --show-sdk-path)" -framework AppKit -o AltChecker.app/Contents/MacOS/AltChecker AltCheckerMac.swift
          codesign --force --deep --sign - AltChecker.app
          ditto -c -k --keepParent AltChecker.app AltChecker-mac.zip
      - uses: actions/upload-artifact@v6
        with:
          name: AltChecker-mac
          path: AltChecker-mac.zip
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build Linux app
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-pip
          python3 -m pip install --user pyinstaller
          python3 -m PyInstaller --onefile --noconsole --name AltChecker --add-data "AltChecker.png:." AltCheckerLinux.py
          cat > dist/AltChecker.desktop << 'EOF'
          [Desktop Entry]
          Name=Alt Checker
          Exec=AltChecker
          Icon=AltChecker
          Type=Application
          Terminal=false
          Categories=Utility;
          EOF
          cp AltChecker.png dist/AltChecker.png
          chmod +x dist/AltChecker
          tar -C dist -czf AltChecker-linux.tar.gz AltChecker AltChecker.png AltChecker.desktop
      - uses: actions/upload-artifact@v6
        with:
          name: AltChecker-linux
          path: AltChecker-linux.tar.gz
  publish:
    needs: [windows, mac, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Alt Checker" --notes "Windows, Mac, and Linux builds."
          gh release upload latest dist/TraceCheck/TraceCheck.exe dist/AltChecker-mac/AltChecker-mac.zip dist/AltChecker-linux/AltChecker-linux.tar.gz --clobber
