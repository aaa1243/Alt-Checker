name: Build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EXE
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force
          Import-Module ps2exe
          Invoke-ps2exe -inputFile TraceCheck.ps1 -outputFile TraceCheck.exe -noConsole -requireAdmin -STA -title "Alt Checker" -iconFile AltChecker.ico
      - uses: actions/upload-artifact@v4
        with:
          name: TraceCheck
          path: TraceCheck.exe
